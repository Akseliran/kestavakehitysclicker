<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelisivun otsikko</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Pelisivun.css" />


</head>
<body>
<div class="tausta"><img src="../main-menu/img/background_landscape.png"></div>
     <section class="paivitykset">
      <h2 class="paivitys-otsikko">Päivitykset</h2>
      <div class="grid-container">
        <button class="paivitys" id="1-paivitys">
          <span>Kampigeneraattori</span>
          <span>20W</span>
          <span class="paivitys_maara" id="paivitysten_maara">0 kpl</span>
        </button>
        <button class="paivitys" id="2-paivitys">
          <span>Aurinkopaneeli</span>
          <span>150W</span>
          <span class="paivitys_maara" id="paivitysten_maara">0 kpl</span>
        </button>
        <button class="paivitys" id="3-paivitys">
          <span>Tuulivoimala</span>
          <span>500W</span>
          <span class="paivitys_maara" id="paivitysten_maara">0 kpl</span>
        </button>
        <button class="paivitys" id="4-paivitys">
          <span>Maalämpövoimala</span>
          <span>2000W</span>
          <span class="paivitys_maara" id="paivitysten_maara">0 kpl</span>
        </button>
        <button class="paivitys" id="5-paivitys">
          <span>Vesivoimala</span>
          <span>5000W</span>
          <span class="paivitys_maara" id="paivitysten_maara">0 kpl</span>
        </button>
        <button class="paivitys" id="6-paivitys">
          <span>Ydinvoima</span>
          <span>10 000W</span>
          <span class="paivitys_maara" id="paivitysten_maara">0 kpl</span>

        </button>
      </div>
    </section>

  <section>
      <button class="energia_boxi">  
      <span class="energia">Energian määrä (W)</span> 
      <span class="maara" id="energia_maara">0</span>
      <span class="energiaps">W/s</span>
      <span id="energiaa_sekunnissa">0</span>
      </button>
  </section>  

    <section>
      <button class="nappi" id="klikki">Nappula</button>
    </section>

</body>
</html>

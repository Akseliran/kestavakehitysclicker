
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testi</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Shop toggle button -->
    <button id="shop-toggle">Kauppa ◀</button>

    <!-- Upgrade shop -->
    <section class="paivitykset" id="shop">

        <h2>Päivitykset</h2>

        <div class="grid-container">

            <div class="paivitys">
                <span>eka</span>
                <span>10</span>
                <button class="buy-btn">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>toinen</span>
                <span>100</span>
                <button class="buy-btn">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>kolmas</span>
                <span>500</span>
                <button class="buy-btn">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>neljäs</span>
                <span>1000</span>
                <button class="buy-btn">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>viies</span>
                <span>2500</span>
                <button class="buy-btn">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

        </div>

    </section>

    <!-- Main button -->
    <button class="Nappi" id="main-button">Nappula</button>

</body>
</html>

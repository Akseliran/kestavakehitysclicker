
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testi</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="energy-display">
    Energy: <span id="energy">0.0</span>
</div>

<p id="message"></p>

    <!-- Shop toggle nappi -->
    <button id="shop-toggle">Kauppa ◀</button>

    <!-- Upgrade shop -->
    <section class="paivitykset" id="shop">

        <h2>Päivitykset!</h2>

        <div class="grid-container">

            <div class="paivitys">
                <span>eka</span>
                <span>10</span>
                <button class="buy-btn" id="upgradeBtn">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>toinen</span>
                <span>100</span>
                <button class="buy-btn" id="upgradeBtn2">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>kolmas</span>
                <span>500</span>
                <button class="buy-btn" id="upgradeBtn3">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>neljäs</span>
                <span>1000</span>
                <button class="buy-btn" id="upgradeBtn4">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>viides</span>
                <span>2500</span>
                <button class="buy-btn" id="upgradeBtn5">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

            <div class="paivitys">
                <span>kuudes</span>
                <span>5000</span>
                <button class="buy-btn" id="upgradeBtn6">Buy</button>
                <span class="buy-count">0 ostettu</span>
            </div>

        </div>

    </section>

    <!-- Main button -->
    <div class="charge-bar"><div class="charge-fill" id="charge-fill"></div></div>
    <p id="eps-display" class="eps-display">0 energy/s</p>

    <button class="Nappi" id="main-button">Luo energiaa</button>

</body>
</html>
